# ============================================================================
# Cloudflare Workers 部署配置 —— wrangler.toml
# ----------------------------------------------------------------------------
# 作用：告诉 Cloudflare 三件事——
#   1. 项目名（部署后的网址前缀）
#   2. 入口文件（worker.js：/api/sync 同步接口 + 其余转给静态网页）
#   3. 静态网页文件夹（dist/：npm run build 的产出）
#
# 这个文件是给「新版 Workers 部署流程」（Deploy command: npx wrangler deploy）
# 用的；老版 Pages 流程（Framework preset: Vite）不看它，也能正常部署。
# 两套流程用同一套代码，互不冲突。
# ============================================================================

name = "xiaohaixingshanganji"

# 运行环境兼容日期（Cloudflare 要求必填，写近期日期即可，不要乱改）
compatibility_date = "2025-09-01"

# Worker 入口文件：负责 /api/sync 数据同步，其余请求转交静态网页
main = "worker.js"

# 静态网站文件目录（npm run build 的输出目录）
[assets]
directory = "./dist"
# 单页应用（SPA）路由模式：访问 /map、/dashboard 等子页面时，
# 平台自动返回 index.html 交给前端路由处理，刷新不会 404。
# （等价于老版 Pages 的 _redirects 规则，但不用单独维护那个文件）
not_found_handling = "single-page-application"
