<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport 设置：让网页在手机上能自适应屏幕宽度（H5 适配的关键一行）；
         viewport-fit=cover 让内容延伸到刘海屏安全区，沉浸式体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="小海星上岸记——0基础脱产考公智能学习系统" />
    <title>小海星上岸记</title>
  </head>
  <body>
    <!-- Vue 应用挂载点：main.js 会把这个 div 替换成整个应用 -->
    <div id="app"></div>
    <!-- Vite 从这里开始加载 src/main.js -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
